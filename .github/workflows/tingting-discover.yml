name: Discover TingtingFM APIs

on:
  workflow_dispatch:
  push:
    paths:
      - 'tingting_discover.py'
      - '.github/workflows/tingting-discover.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect program pages
        run: python tingting_discover.py
      - name: Save diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tingting-diagnostics
          path: tingting-diagnostics/
          if-no-files-found: warn
